name: Worker tests

# Runs the Cloudflare Worker test suite (worker/src/**/*.test.ts, 4000+ tests).
#
# This is a REUSABLE workflow. deploy-worker.yml calls it and gates the deploy
# on it (needs: test), so a red suite now blocks shipping the Worker. It used
# to run alongside the deploy on the same push trigger without gating it, which
# meant 4000+ tests could fail and the Worker shipped anyway.
#
# The push trigger here is deliberately narrowed to this file only. A worker/**
# push is covered by deploy-worker.yml calling this workflow, so a broader
# trigger would run the whole suite twice per push. Changes to this file still
# get their own run so the gate itself stays exercised.
#
# The pull_request trigger carries NO path filter, on purpose. Until 2026-08-17
# this workflow ran only on push to main, so the gate protected the DEPLOY but
# not the BRANCH: a PR changing Worker code merged with zero test signal and
# only went red after the bad commit was already on main. PR #181 landed that
# way, reporting "no checks reported on the branch".
#
# A path filter is tempting and wrong here. These tests read well outside
# worker/: data/*.json (pricing, benchmarks, harnesses, agents-directory,
# premium-catalog), public/ (openapi.json, openapi.yaml, llms.txt,
# postman-collection.json, .well-known/x402.json), several src/app/**/page.tsx,
# sdk/python and sdk/javascript sources and READMEs, mcp-server/src/index.ts,
# and scripts/push-to-huggingface.py. Any hand-maintained list of those paths
# would silently drift the first time a new test reads a new file, which is the
# exact failure mode this suite exists to catch. The full run costs about 30
# seconds, so running it on every PR is cheaper than maintaining the list.
#
# Locally: cd worker && npm test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'RipperMercs/tensorfeed' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm install

      # VITEST_SKIP_LIVE=1 skips the handful of live-network smoke tests
      # (worker/src/x402-index/live.test.ts) that hit Base mainnet RPC and the
      # live tensorfeed.ai manifest. Those verify external infrastructure, not
      # Worker code, so a transient RPC hiccup should not paint this signal red.
      # They still run by default on a developer's local `npm test`.
      - name: Run tests
        working-directory: worker
        run: npm test
        env:
          VITEST_SKIP_LIVE: '1'
